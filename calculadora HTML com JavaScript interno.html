<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>JavaScript na Prática</title>
</head>
<body>
    <form>
        <label>Valor A</label>
        <input type="number" id="v1"/>
        <br>

        <label>Valor B</label>
        <input type="number" id="v2"/>
        <br>

        <label>Operação</label>
        <select id="oper">
            <option>Soma</option>
            <option>Subtração</option>
            <option>Multiplicação</option>
            <option>Divisão</option>
            <option>Potência</option>
        </select>
        <br>

        <button type="button" onclick="executar()">Calcular</button>
    </form>

    <div id="resposta">A resposta da operação está aqui</div>

    <script>
        const somar = (a, b) => a + b;
        const subtrair = (a, b) => a - b;
        const multiplicar = (a, b) => a * b;
        const dividir = (a, b) => a / b;
        const exponencial = (a, b) => a ** b;

        function executar() {
            const a = Number(document.getElementById("v1").value);
            const b = Number(document.getElementById("v2").value); 
            const oper = document.getElementById("oper").selectedIndex;
            if (document.getElementById("v1").value === "" || 
        document.getElementById("v2").value === "") {
            document.getElementById("resposta").innerHTML= 
                                                         "Preencha os dois valores para realizar a operação!";
                return;   
        }        

            let resultado;
            switch (oper) {
                case 0: resultado = somar(a, b); break;
                case 1: resultado = subtrair(a, b); break;
                case 2: resultado = multiplicar(a, b); break;
                case 3: resultado = (b==0) ? "Erro Divisão por zero": dividir(a, b); break;
                case 4: resultado = exponencial(a, b); break;
            }

            document.getElementById("resposta").innerHTML =
                `A resposta da operação é ${resultado}`;
        }
        
    </script>
</body>
</html>
